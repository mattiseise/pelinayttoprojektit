<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 355" role="img" aria-labelledby="title"><title id="title">Raahaa Hierarchyn objekti saman nimiseen kenttään</title><rect width="1100" height="355" fill="#eef3fb"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="27" font-weight="bold" fill="#172b4d">Raahaa Hierarchyn objekti saman nimiseen kenttään</text><text x="35" y="74" font-size="17" fill="#44546f">Havainnekuva – ei Unityn tai GitHubin kuvakaappaus</text><rect x="30" y="95" width="495" height="235" rx="12" fill="white" stroke="#b6c6df"/><text x="45" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Hierarchy → Inspector</text><text x="45" y="167" font-size="18" fill="#172b4d">MenuPanel → Menu Panel</text><text x="45" y="197" font-size="18" fill="#172b4d">GamePanel → Game Panel</text><text x="45" y="227" font-size="18" fill="#172b4d">ResultPanel → Result Panel</text><text x="45" y="257" font-size="18" fill="#172b4d">OrderText → Order Text</text><text x="45" y="287" font-size="18" fill="#172b4d">ScoreText → Score Text</text><text x="45" y="317" font-size="18" fill="#172b4d">FinalScoreText → Final Score Text</text><rect x="540" y="95" width="495" height="235" rx="12" fill="white" stroke="#b6c6df"/><text x="555" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Valitse ensin GameManager</text><text x="555" y="167" font-size="18" fill="#172b4d">Liitä GameManager.cs tähän objektiin.</text><text x="555" y="197" font-size="18" fill="#172b4d">Paneelikentät: GameObject</text><text x="555" y="227" font-size="18" fill="#172b4d">Tekstikentät: TMP_Text</text><text x="555" y="257" font-size="18" fill="#172b4d">None tarkoittaa: kenttä on vielä tyhjä.</text><text x="555" y="287" font-size="18" fill="#172b4d">Raahaa scene-objekti, älä .cs-tiedostoa.</text><text x="555" y="317" font-size="18" fill="#172b4d">TimeTextille ei ole vielä koodikenttää.</text></g></svg>