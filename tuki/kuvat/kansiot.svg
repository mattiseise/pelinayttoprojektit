<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 415" role="img" aria-labelledby="title"><title id="title">Unity-projekti kuuluu repositoryn juureen</title><rect width="1100" height="415" fill="#eef3fb"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="27" font-weight="bold" fill="#172b4d">Unity-projekti kuuluu repositoryn juureen</text><text x="35" y="74" font-size="17" fill="#44546f">Havainnekuva – ei Unityn tai GitHubin kuvakaappaus</text><rect x="30" y="95" width="495" height="295" rx="12" fill="white" stroke="#b6c6df"/><text x="45" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Repositoryn kansio</text><text x="45" y="167" font-size="18" fill="#172b4d">Assets/</text><text x="45" y="197" font-size="18" fill="#172b4d">  Scenes/CafeGame.unity</text><text x="45" y="227" font-size="18" fill="#172b4d">  Scripts/</text><text x="45" y="257" font-size="18" fill="#172b4d">Packages/</text><text x="45" y="287" font-size="18" fill="#172b4d">ProjectSettings/</text><text x="45" y="317" font-size="18" fill="#172b4d">project-docs/</text><text x="45" y="347" font-size="18" fill="#172b4d">.gitignore</text><text x="45" y="377" font-size="18" fill="#172b4d">README.md</text><rect x="540" y="95" width="495" height="295" rx="12" fill="white" stroke="#b6c6df"/><text x="555" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Tarkista GitHub Desktopissa</text><text x="555" y="167" font-size="18" fill="#172b4d">Näiden kuuluu näkyä Changes-listassa.</text><text x="555" y="197" font-size="18" fill="#172b4d">Unity-projekti ei ole toinen sisäkkäinen</text><text x="555" y="227" font-size="18" fill="#172b4d">kansio.</text><text x="555" y="257" font-size="18" fill="#172b4d">Library/ ja Temp/ eivät kuulu Gitiin.</text><text x="555" y="287" font-size="18" fill="#172b4d">Builds/ on paikallinen testijulkaisu.</text><text x="555" y="317" font-size="18" fill="#172b4d">Älä korvaa olemassa olevaa README:tä.</text><text x="555" y="347" font-size="18" fill="#172b4d">Älä luo toista repositorya.</text></g></svg>