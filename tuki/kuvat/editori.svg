5" y="227" font-size="18" fill="#172b4d">Muuta tekstiä tai</text><text x="555" y="257" font-size="18" fill="#172b4d">sijaintia.</text><text x="555" y="287" font-size="18" fill="#172b4d">Liitä skripti</text><text x="555" y="317" font-size="18" fill="#172b4d">objektiin.</text><text x="555" y="347" font-size="18" fill="#172b4d">Täytä GameManagerin</text><text x="555" y="377" font-size="18" fill="#172b4d">kentät.</text><rect x="795" y="95" width="240" height="295" rx="12" fill="white" stroke="#b6c6df"/><text x="810" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Game / Console</text><text x="810" y="167" font-size="18" fill="#172b4d">Game näyttää pelaajan</text><text x="810" y="197" font-size="18" fill="#172b4d">ruudun.</text><text x="810" y="227" font-size="18" fill="#172b4d">Play käynnistää</text><text x="810" y="257" font-size="18" fill="#172b4d">testin.</text><text x="810" y="287" font-size="18" fill="#172b4d">Console näyttää</text><text x="810" y="317" font-size="18" fill="#172b4d">koodivirheet.</text><text x="810" y="347" font-size="18" fill="#172b4d">Poistu Play-tilasta</text><text x="810" y="377" font-size="18" fill="#172b4d">ennen muokkausta.</text></g></svg>