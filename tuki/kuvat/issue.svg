<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 355" role="img" aria-labelledby="title"><title id="title">Yksi GitHub-issue = yksi rajattu muutos</title><rect width="1100" height="355" fill="#eef3fb"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="27" font-weight="bold" fill="#172b4d">Yksi GitHub-issue = yksi rajattu muutos</text><text x="35" y="74" font-size="17" fill="#44546f">Havainnekuva – ei Unityn tai GitHubin kuvakaappaus</text><rect x="30" y="95" width="495" height="235" rx="12" fill="white" stroke="#b6c6df"/><text x="45" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Kirjoita tehtävä</text><text x="45" y="167" font-size="18" fill="#172b4d">Otsikko: Vaihda valikosta peliin</text><text x="45" y="197" font-size="18" fill="#172b4d">Teen: Aloita vaihtaa ruudun.</text><text x="45" y="227" font-size="18" fill="#172b4d">Valmis kun: vain GamePanel näkyy.</text><text x="45" y="257" font-size="18" fill="#172b4d">Arvio: oma arvio ohjaajan kanssa</text><rect x="540" y="95" width="495" height="235" rx="12" fill="white" stroke="#b6c6df"/><text x="555" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Tallenna ja tarkista</text><text x="555" y="167" font-size="18" fill="#172b4d">Repository → Issues → New issue</text><text x="555" y="197" font-size="18" fill="#172b4d">Kirjoita otsikko ja kuvaus.</text><text x="555" y="227" font-size="18" fill="#172b4d">Create / Submit new issue</text><text x="555" y="257" font-size="18" fill="#172b4d">Valitse Labels → P0 pakollinen.</text><text x="555" y="287" font-size="18" fill="#172b4d">Myöhemmin: testi + commit-linkki</text><text x="555" y="317" font-size="18" fill="#172b4d">Sulje vasta valmiina.</text></g></svg>