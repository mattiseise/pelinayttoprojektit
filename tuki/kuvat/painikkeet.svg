<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 355" role="img" aria-labelledby="title"><title id="title">Painike kutsuu GameManagerin toimintoa</title><rect width="1100" height="355" fill="#eef3fb"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="27" font-weight="bold" fill="#172b4d">Painike kutsuu GameManagerin toimintoa</text><text x="35" y="74" font-size="17" fill="#44546f">Havainnekuva – ei Unityn tai GitHubin kuvakaappaus</text><rect x="30" y="95" width="325" height="235" rx="12" fill="white" stroke="#b6c6df"/><text x="45" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Valitse painike</text><text x="45" y="167" font-size="18" fill="#172b4d">StartButton</text><text x="45" y="197" font-size="18" fill="#172b4d">CoffeeButton</text><text x="45" y="227" font-size="18" fill="#172b4d">SubmitButton</text><text x="45" y="257" font-size="18" fill="#172b4d">RestartButton</text><rect x="370" y="95" width="325" height="235" rx="12" fill="white" stroke="#b6c6df"/><text x="385" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">On Click () -toiminto</text><text x="385" y="167" font-size="18" fill="#172b4d">GameManager → StartGame()</text><text x="385" y="197" font-size="18" fill="#172b4d">GameManager → SelectCoffee()</text><text x="385" y="227" font-size="18" fill="#172b4d">GameManager → SubmitOrder()</text><text x="385" y="257" font-size="18" fill="#172b4d">GameManager → RestartGame()</text><rect x="710" y="95" width="325" height="235" rx="12" fill="white" stroke="#b6c6df"/><text x="725" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">Kytke näin</text><text x="725" y="167" font-size="18" fill="#172b4d">1. Paina On Click () -listan</text><text x="725" y="197" font-size="18" fill="#172b4d">+.</text><text x="725" y="227" font-size="18" fill="#172b4d">2. Raahaa</text><text x="725" y="257" font-size="18" fill="#172b4d">GameManager-objekti.</text><text x="725" y="287" font-size="18" fill="#172b4d">3. Avaa No Function -valikko.</text><text x="725" y="317" font-size="18" fill="#172b4d">4. Valitse oikea metodi.</text></g></svg>