<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 325" role="img" aria-labelledby="title"><title id="title">Kolme ruutua: viikon 36 pieni peli</title><rect width="1100" height="325" fill="#eef3fb"/><g font-family="Arial, sans-serif"><text x="35" y="44" font-size="27" font-weight="bold" fill="#172b4d">Kolme ruutua: viikon 36 pieni peli</text><text x="35" y="74" font-size="17" fill="#44546f">Havainnekuva – ei Unityn tai GitHubin kuvakaappaus</text><rect x="30" y="95" width="325" height="205" rx="12" fill="white" stroke="#b6c6df"/><text x="45" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">MenuPanel</text><text x="45" y="167" font-size="18" fill="#172b4d">Pelin nimi</text><text x="45" y="197" font-size="18" fill="#172b4d">[ Aloita ]</text><text x="45" y="227" font-size="18" fill="#172b4d">Aloita → GamePanel</text><rect x="370" y="95" width="325" height="205" rx="12" fill="white" stroke="#b6c6df"/><text x="385" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">GamePanel</text><text x="385" y="167" font-size="18" fill="#172b4d">Asiakas tilaa: Kahvi</text><text x="385" y="197" font-size="18" fill="#172b4d">Pisteet: 0</text><text x="385" y="227" font-size="18" fill="#172b4d">Aika: lisätään viikolla 38</text><text x="385" y="257" font-size="18" fill="#172b4d">[ Kahvi ]   [ Toimita ]</text><text x="385" y="287" font-size="18" fill="#172b4d">Toimita → ResultPanel</text><rect x="710" y="95" width="325" height="205" rx="12" fill="white" stroke="#b6c6df"/><text x="725" y="127" font-size="22" font-weight="bold" fill="#1d4ed8">ResultPanel</text><text x="725" y="167" font-size="18" fill="#172b4d">Pisteet: 10 tai 0</text><text x="725" y="197" font-size="18" fill="#172b4d">[ Pelaa uudelleen ]</text><text x="725" y="227" font-size="18" fill="#172b4d">Uudelleen → GamePanel</text><text x="725" y="257" font-size="18" fill="#172b4d">Top 5 lisätään viikolla 40</text></g></svg>