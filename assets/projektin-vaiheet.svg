<svg xmlns="http://www.w3.org/2000/svg" width="880" height="692" viewBox="0 0 880 692" role="img" aria-labelledby="title desc">
<title id="title">KahvilaKoodi: projektin vaiheet</title>
<desc id="desc">1. Valmistelu (viikot 48): Lisäät Unity-projektin repositoryyn ja kokeilet tyhjää peliä selaimessa. Selvität avoimet asiat asiakkaan kanssa ja pilkot ensimmäisen featuren GitHub-issueiksi, jotta rakennat sellaista peliä, jota asiakas haluaa. 2. Pelattava peli (viikot 49–53): Rakennat pelin toiminto kerrallaan: kierros, tuotelista, kello ja pisteet, kasvava kiire ja top 5 -lista. Joululomalla teet työtä itsenäisesti sovittuina päivinä, jouluviikolla kevyemmin. 3. Testaus ja asiakkaan palaute (viikot 1–2): Testaat pelin yhdeksällä testitapauksella. Sen jälkeen asiakas pelaa peliä, ja teet hänen toivomansa muutoksen omassa Git-haarassasi. 4. Julkaisu ja näyttö (viikot 3–4): Uusi pelaaja testaa julkaisuehdokkaan. Korjaat kaksi virhettä, kirjaat kummastakin korjausketjun ja julkaiset version v1.0 GitHub Pagesiin. Lopuksi kokoat näyttöaineiston ja harjoittelet demon.</desc>
<rect width="880" height="692" fill="#ffffff"/>
<defs><marker id="nuoli" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c5347" stroke-width="1.4"/></marker></defs>
<text x="40" y="49" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Mitä syntyy missäkin vaiheessa?</text>
<rect x="90" y="78" width="752" height="132" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<circle cx="45" cy="107" r="24" fill="#0d9488"/>
<text x="45" y="117" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">1</text>
<text x="112" y="114" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Valmistelu</text>
<text x="822" y="114" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 48</text>
<text x="112" y="150" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Unity repositoryyn → asiakkaan vastaukset → issuet</text>
<text x="112" y="180" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Tyhjä peli aukeaa selaimessa, ja rajaus on hyväksytty.</text>
<path d="M45 136V224" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="230" width="752" height="132" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<circle cx="45" cy="259" r="24" fill="#d97706"/>
<text x="45" y="269" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">2</text>
<text x="112" y="266" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Pelattava peli</text>
<text x="822" y="266" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 49–53</text>
<text x="112" y="302" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Kierros → tuotelista → kello → kiire → top 5</text>
<text x="112" y="332" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Toimeksiannon kaikki vaatimukset toimivat.</text>
<path d="M45 288V376" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="382" width="752" height="132" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="45" cy="411" r="24" fill="#7c3aed"/>
<text x="45" y="421" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">3</text>
<text x="112" y="418" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Testaus ja asiakkaan palaute</text>
<text x="822" y="418" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 1–2</text>
<text x="112" y="454" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">9 testitapausta → asiakas pelaa → muutos haarassa</text>
<text x="112" y="484" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Peli on testattu ja vastaa asiakkaan toivetta.</text>
<path d="M45 440V528" stroke="#d4cbbb" stroke-width="2" marker-end="url(#nuoli)"/>
<rect x="90" y="534" width="752" height="132" rx="12" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
<circle cx="45" cy="563" r="24" fill="#db2777"/>
<text x="45" y="573" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">4</text>
<text x="112" y="570" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Julkaisu ja näyttö</text>
<text x="822" y="570" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">Viikot 3–4</text>
<text x="112" y="606" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">RC1 → 2 korjausketjua → v1.0 → näyttö</text>
<text x="112" y="636" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="21">Asiakas voi avata pelin linkistä omalla koneellaan.</text>
</svg>
