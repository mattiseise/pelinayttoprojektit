<svg xmlns="http://www.w3.org/2000/svg" width="880" height="704" viewBox="0 0 880 704" role="img" aria-labelledby="title desc">
<title id="title">Kahvilavuoro pelaajan silmin: pelaajan työnkulku neljässä vaiheessa</title>
<desc id="desc">Havainnekuva pelaajan työnkulusta, ei kuvakaappaus valmiista pelistä. 1 Aloitusvalikko: valikossa on pelin nimi, jonka päätät itse, ja Aloita-painike. Pelaaja avaa pelin selaimessa ja painaa Aloita. 2 Tilaus ja toimitus: näytön yläreunassa lukee Aika 42 s ja Pisteet 30. Asiakas tilaa kahvin ja sämpylän. Pelaaja valitsee tuotepainikkeista Kahvi ja Sämpylä ja painaa Toimita. Peli näyttää palautteen Oikein! +20, ja uusi asiakas saapuu. 3 Kiire kasvaa: esimerkissä taso vaihtuu pisteiden mukaan, taso 1 pisteillä 0–30, taso 2 pisteillä 31–60 ja taso 3 pisteillä 61 tai enemmän. Pisteiden kasvaessa tilaukset isonevat tai asiakkaat odottavat lyhyemmän ajan. 4 Tulos talteen: kun aika loppuu, tulosruutu näyttää Pisteet 85. Pelaaja kirjoittaa nimimerkin ja painaa Tallenna tulos. Top 5 -listalla ovat Kofeiini 120, Pulla 95, Sinä 85, Latte 60 ja Nimetön 40. Pelaa uudelleen vie takaisin aloitukseen. Nuolet: Aloita vie vaiheesta 1 vaiheeseen 2, pisteet kasvavat vie vaiheeseen 3, aika loppuu vie vaiheeseen 4 ja Pelaa uudelleen takaisin vaiheeseen 1.</desc>
<rect width="880" height="704" fill="#ffffff"/>
<defs>
  <marker id="nuoli" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5c5347"/></marker>
</defs>
<text x="32" y="40" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Kahvilavuoro pelaajan silmin</text>
<text x="32" y="66" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="15">Havainnekuva pelaajan työnkulusta. Ei kuvakaappaus valmiista pelistä.</text>

<!-- 1 Aloitusvalikko -->
<rect x="32" y="90" width="360" height="270" rx="14" fill="#ffffff" stroke="#d4cbbb" stroke-width="2"/>
<circle cx="64" cy="122" r="18" fill="#1d4ed8"/>
<text x="64" y="129" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text>
<text x="92" y="129" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Aloitusvalikko</text>
<rect x="50" y="146" width="324" height="150" rx="10" fill="#f4f8fe" stroke="#bfd0f2" stroke-width="1.5"/>
<text x="212" y="198" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Kahvilapeli</text>
<text x="212" y="220" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">pelin nimen päätät itse</text>
<rect x="152" y="236" width="120" height="40" rx="8" fill="#2563eb"/>
<text x="212" y="262" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Aloita</text>
<text x="50" y="320" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">Pelaaja avaa pelin selaimessa</text>
<text x="50" y="342" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">ja painaa aloitusvalikossa Aloita.</text>

<!-- 2 Tilaus ja toimitus -->
<rect x="488" y="90" width="360" height="270" rx="14" fill="#ffffff" stroke="#d4cbbb" stroke-width="2"/>
<circle cx="520" cy="122" r="18" fill="#1d4ed8"/>
<text x="520" y="129" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text>
<text x="548" y="129" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Tilaus ja toimitus</text>
<rect x="506" y="146" width="324" height="150" rx="10" fill="#f4f8fe" stroke="#bfd0f2" stroke-width="1.5"/>
<text x="520" y="170" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14">Aika 42 s</text>
<text x="816" y="170" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end">Pisteet 30</text>
<rect x="520" y="180" width="296" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="532" y="201" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Asiakas tilaa: Kahvi, Sämpylä</text>
<rect x="520" y="224" width="62" height="28" rx="6" fill="#eaf1fd" stroke="#2563eb" stroke-width="2"/>
<text x="551" y="243" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Kahvi</text>
<rect x="590" y="224" width="50" height="28" rx="6" fill="#ffffff" stroke="#d4cbbb" stroke-width="1.5"/>
<text x="615" y="243" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Tee</text>
<rect x="648" y="224" width="76" height="28" rx="6" fill="#eaf1fd" stroke="#2563eb" stroke-width="2"/>
<text x="686" y="243" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Sämpylä</text>
<rect x="734" y="224" width="82" height="28" rx="6" fill="#2563eb"/>
<text x="775" y="243" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Toimita</text>
<text x="520" y="280" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Oikein! +20</text>
<text x="816" y="280" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end">uusi asiakas saapuu</text>
<text x="506" y="320" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">Asiakas tilaa 1–3 tuotetta. Pelaaja</text>
<text x="506" y="342" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">toimittaa, ja palaute näkyy heti.</text>

<!-- 3 Kiire kasvaa -->
<rect x="488" y="412" width="360" height="270" rx="14" fill="#ffffff" stroke="#d4cbbb" stroke-width="2"/>
<circle cx="520" cy="444" r="18" fill="#1d4ed8"/>
<text x="520" y="451" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">3</text>
<text x="548" y="451" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Kiire kasvaa</text>
<rect x="506" y="468" width="324" height="150" rx="10" fill="#f4f8fe" stroke="#bfd0f2" stroke-width="1.5"/>
<text x="520" y="490" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14">Esimerkki: taso vaihtuu pisteiden mukaan</text>
<text x="566" y="570" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">0–30 p</text>
<rect x="526" y="578" width="80" height="30" rx="4" fill="#eaf1fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="566" y="599" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Taso 1</text>
<text x="662" y="544" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">31–60 p</text>
<rect x="622" y="552" width="80" height="56" rx="4" fill="#bcd0f7" stroke="#2563eb" stroke-width="1.5"/>
<text x="662" y="599" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Taso 2</text>
<text x="758" y="518" fill="#5c5347" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">61+ p</text>
<rect x="718" y="526" width="80" height="82" rx="4" fill="#2563eb"/>
<text x="758" y="599" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Taso 3</text>
<text x="506" y="642" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">Pisteiden kasvaessa tilaukset isonevat tai</text>
<text x="506" y="664" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">asiakkaat odottavat lyhyemmän ajan.</text>

<!-- 4 Tulos talteen -->
<rect x="32" y="412" width="360" height="270" rx="14" fill="#ffffff" stroke="#d4cbbb" stroke-width="2"/>
<circle cx="64" cy="444" r="18" fill="#1d4ed8"/>
<text x="64" y="451" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">4</text>
<text x="92" y="451" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Tulos talteen</text>
<rect x="50" y="468" width="324" height="150" rx="10" fill="#f4f8fe" stroke="#bfd0f2" stroke-width="1.5"/>
<text x="64" y="496" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Pisteet 85</text>
<rect x="64" y="510" width="136" height="30" rx="6" fill="#ffffff" stroke="#d4cbbb" stroke-width="1.5"/>
<text x="74" y="530" fill="#8a7f70" font-family="Arial, Helvetica, sans-serif" font-size="14">Nimimerkki</text>
<rect x="64" y="550" width="136" height="30" rx="6" fill="#2563eb"/>
<text x="132" y="570" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Tallenna tulos</text>
<rect x="64" y="586" width="136" height="26" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="132" y="604" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Pelaa uudelleen</text>
<text x="220" y="496" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Top 5</text>
<text x="220" y="518" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">1. Kofeiini 120</text>
<text x="220" y="538" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">2. Pulla 95</text>
<rect x="214" y="543" width="146" height="21" rx="4" fill="#eaf1fd"/>
<text x="220" y="558" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">3. Sinä 85</text>
<text x="220" y="578" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">4. Latte 60</text>
<text x="220" y="598" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="14">5. Nimetön 40</text>
<text x="50" y="642" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">Pelaaja tallentaa tuloksen nimimerkillä.</text>
<text x="50" y="664" fill="#241f1a" font-family="Arial, Helvetica, sans-serif" font-size="15">Top 5 säilyy, kun peli avataan uudelleen.</text>

