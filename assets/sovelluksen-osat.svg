<svg xmlns="http://www.w3.org/2000/svg" width="880" height="616" viewBox="0 0 880 616" role="img" aria-labelledby="title desc">
<title id="title">Miten KahvilaKoodin osat liittyvät toisiinsa</title>
<desc id="desc">Havainnekuva pelin rakenteesta, ei kuvakaappaus Unitysta. Koko peli on yhdessä CafeGame-scenessä. Sen Canvasilla on kolme ruutua: MenuPanel, jossa ovat pelin nimi ja Aloita-painike, GamePanel, jossa ovat tilaus, tuotepainikkeet, Toimita-painike, palaute, aika ja pisteet, sekä ResultPanel, jossa ovat pisteet, nimimerkki, top 5 -lista ja Pelaa uudelleen -painike. Tekstit ja painikkeet tehdään TextMeshProlla. Painikkeen painallus kutsuu C#-skriptin metodia (On Click), ja skriptit päivittävät ruudut ja tekstit. C#-skriptit ovat kansiossa Assets/Scripts: GameManager hoitaa ruudut, ajan ja pisteet, OrderManager tilauksen ja toimituksen tarkistuksen, DifficultyController vaikeustason pisteiden mukaan, ProductDatabase lukee products.json-tiedoston ja SaveService tallentaa top 5 -listan. Data on erillään koodista: products.json kansiossa Assets/Data sisältää tuotteet ja pisteet, ja PlayerPrefs säilyttää top 5 -tulokset selaimen muistissa. Unity-editorissa Hierarchy näyttää objektit, Inspectorissa tehdään kytkennät, Play Modessa kokeillaan ja Build Profilesista tehdään build. Julkaisu selaimeen: Unity-projekti on GitHub-repositoryssa commit ja push -periaatteella, WebGL-build tehdään Build Profilesin Web-alustalla docs-kansioon, GitHub Pages julkaisee docs-kansion julkisena linkkinä ja pelaajan selain avaa pelin linkistä ilman asennusta. Testiversio tehdään Build And Run -toiminnolla omalle koneelle, eikä Builds-kansio mene Gitiin.</desc>
<rect width="880" height="616" fill="#ffffff"/>
<defs>
  <marker id="nuoli" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#5c5347"/></marker>
</defs>
